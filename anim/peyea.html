.pulse{transform-box:fill-box;transform-origin:center;animation:pu 1.6s 1.8s ease-out infinite;opacity:0}
@keyframes pu{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
@media (prefers-reduced-motion:reduce){.f,.d,.pulse{animation:none;opacity:1;stroke-dashoffset:0}}
